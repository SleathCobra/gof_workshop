name: Release Workshop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: src/Gof2Workshop.App/Gof2Workshop.App.csproj
  CONFIGURATION: Release

jobs:
  test:
    name: Validate
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GalaxyOnFire2Workshop.sln

      - name: Build
        run: dotnet build GalaxyOnFire2Workshop.sln --configuration $env:CONFIGURATION --no-restore

      - name: Test
        run: dotnet test GalaxyOnFire2Workshop.sln --configuration $env:CONFIGURATION --no-build --no-restore

  publish:
    name: Publish ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            archive: zip
          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - name: macOS Apple Silicon
            os: macos-14
            rid: osx-arm64
            archive: tar.gz
          - name: macOS Intel
            os: macos-13
            rid: osx-x64
            archive: tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore for target runtime
        shell: bash
        run: dotnet restore "$PROJECT" --runtime "${{ matrix.rid }}"

      - name: Publish self-contained application
        shell: bash
        run: >-
          dotnet publish "$PROJECT"
          --configuration "$CONFIGURATION"
          --runtime "${{ matrix.rid }}"
          --self-contained true
          --no-restore
          --output publish

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "GalaxyOnFire2Workshop-${{ matrix.rid }}-${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item LICENSE "publish/LICENSE.txt"
          Compress-Archive -Path publish/* -DestinationPath "dist/$name.zip"

      - name: Package Unix application
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="GalaxyOnFire2Workshop-${{ matrix.rid }}-${GITHUB_REF_NAME}"
          mkdir -p dist "$name"
          cp LICENSE "$name/LICENSE.txt"
          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            app="$name/GalaxyOnFire2Workshop.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp -R publish/. "$app/Contents/MacOS/"
            cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDisplayName</key><string>Galaxy on Fire 2 Workshop</string>
            <key>CFBundleExecutable</key><string>Gof2Workshop.App</string>
            <key>CFBundleIdentifier</key><string>org.gof2workshop.app</string>
            <key>CFBundleName</key><string>Galaxy on Fire 2 Workshop</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleVersion</key><string>${GITHUB_SHA:0:12}</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
            PLIST
            chmod +x "$app/Contents/MacOS/Gof2Workshop.App"
          else
            cp -R publish/. "$name/"
          fi
          tar -czf "dist/$name.tar.gz" "$name"

      - name: Create checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish release and checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
